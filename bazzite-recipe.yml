name: bazzite-macos-edition
description: Bazzite avec l'expérience visuelle complète de macOS (WhiteSur)

# Base Bazzite avec support Nvidia (si tu as une carte Nvidia, sinon retire -nvidia)
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia
image-version: latest

modules:
  # --- ÉTAPE 1 : INJECTER LES FICHIERS DU THÈME ---
  - type: files
    files:
      - source: system
        destination: / 

  # --- ÉTAPE 2 : INSTALLER LES OUTILS DE PERSONNALISATION ---
  - type: rpm-ostree
    install:
      - gnome-tweaks
      - dconf-editor
      - sassc
      - nautilus-python # Utile pour certaines extensions de fichiers

  # --- ÉTAPE 3 : FORCER LES RÉGLAGES MACOS (Boutons à gauche, thèmes) ---
  - type: dconf
    settings:
      org.gnome.desktop.wm.preferences:
        button-layout: "close,minimize,maximize:" # Boutons à GAUCHE comme sur Mac
      org.gnome.desktop.interface:
        gtk-theme: "WhiteSur-Light"
        icon-theme: "WhiteSur"
        cursor-theme: "WhiteSur-cursors"
        font-name: "SF Pro Display 11"
      org.gnome.shell.extensions.apple-menu:
        show-apple-icon: true

  # --- ÉTAPE 4 : SIGNATURE ---
  - type: signing
